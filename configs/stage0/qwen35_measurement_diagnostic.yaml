    candidate_sequences: 400
    representation_forwards: 0

uncertainty:
  independent_unit: pair_id
  confidence_level: 0.95
  cluster_bootstrap_resamples: 2000
  cluster_bootstrap_seed: 20260908
  exact_reruns_pooled: false

decision_criteria:
  chance_accuracy: 0.50
  sesoi_absolute_accuracy: 0.10
  signal_present_if_point_at_least: 0.60
  signal_present_if_ci_low_above: 0.50
  position_following_interface_evidence_if_ci_low_at_least: 0.90
  rescue_gain_if_point_at_least: 0.10
  rescue_gain_if_ci_low_above: 0.0
  root_cause_priority:
    - mixed_if_interface_evidence_and_rescue_gain_and_original_candidate_scoring_not_signal_present
    - measurement_interface_if_interface_evidence_and_candidate_scoring_or_representation_signal_present
    - visual_representation_if_no_interface_evidence_and_candidate_scoring_and_representation_not_signal_present_and_rescue_gain
    - inconclusive_otherwise
  action_map:
    measurement/interface: A_RETAIN_QWEN35_REDESIGN_MEASUREMENT
    visual representation: B_REJECT_QWEN35_EVALUATE_QWEN25_UNDER_NEW_CONTRACT
    mixed: B_REJECT_QWEN35_EVALUATE_QWEN25_UNDER_NEW_CONTRACT
    inconclusive: C_SCREEN_ARCHITECTURALLY_DISTINCT_BACKBONE

