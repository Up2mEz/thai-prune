    pair_count: 100
    image_forwards: 800
    primary_metric: retrieval_accuracy
    secondary_metric: same_minus_other_cosine_similarity
  D4_visual_rescue:
    source_condition: noto_sans_thai_regular__72__center
    pair_count: 100
    canvas_size: [448, 448]
    processor_and_visual_token_contract_changed: false
    transform: content_bbox_plus_8px_padding_bicubic_fit_to_320px_centered
