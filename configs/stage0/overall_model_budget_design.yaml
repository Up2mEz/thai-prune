schema_version: 1
status: OVERALL_MODEL_BUDGET_DESIGN_FROZEN_PENDING_LOCKED_AUTHORIZATION
frozen_date: 2026-09-13
research_question: Does Thai-specific OCR adaptation change the degradation curve under controlled visual-information reduction?

models:
  - role: BASE
    model_id: PaddlePaddle/PaddleOCR-VL-1.6
    revision: c5630abae1d940eafe0697512a0325494b02ab42
  - role: SPECIALIZED
    model_id: wayu-ai/wayu-paxa-ocr-zero
    revision: af0204b4f334a6d5068b6bac2b3738932d6e289b

intervention:
  family: INPUT_RESOLUTION_REDUCTION
  processor_geometry_evidence: docs/stage0/PADDLE_WAYU_PROCESSOR_GEOMETRY.json
  excluded_families:
    - PRE_ENCODER_REDUCTION
    - POST_ENCODER_TOKEN_PRUNING
    - TOKEN_MERGING_OR_POOLING
    - DYNAMIC_DECODING_TIME_TOKEN_ACCESS
  source_canvas: [448, 448]
  processor_resample: BICUBIC
  patch_size: 14
  spatial_merge_size: 2
  temporal_grid: 1
  scientific_budget_unit: ACTUAL_LLM_IMAGE_PLACEHOLDERS
  force_exact_processor_area: true
  budgets:
    - {budget_id: B256_FULL, input_resolution: [448, 448], min_pixels: 200704, max_pixels: 200704, image_grid_thw: [1, 32, 32], pre_merge_patches: 1024, projector_positions: 256, llm_image_placeholders: 256, fraction_full: 1.0}
    - {budget_id: B196, input_resolution: [392, 392], min_pixels: 153664, max_pixels: 153664, image_grid_thw: [1, 28, 28], pre_merge_patches: 784, projector_positions: 196, llm_image_placeholders: 196, fraction_full: 0.765625}
    - {budget_id: B121, input_resolution: [308, 308], min_pixels: 94864, max_pixels: 94864, image_grid_thw: [1, 22, 22], pre_merge_patches: 484, projector_positions: 121, llm_image_placeholders: 121, fraction_full: 0.47265625}
    - {budget_id: B64, input_resolution: [224, 224], min_pixels: 50176, max_pixels: 50176, image_grid_thw: [1, 16, 16], pre_merge_patches: 256, projector_positions: 64, llm_image_placeholders: 64, fraction_full: 0.25}

dataset:
  allocation_source: configs/stage0/calibration_design.yaml
  pair_source: configs/stage0/candidate_pairs.yaml
  split: PREVIOUSLY_FROZEN_LOCKED_VALIDATION
  pair_count: 100
  components:
    - BASE_CHARACTER
    - TONE_MARK
    - UPPER_VOWEL_VARIANT
    - LOWER_VOWEL_VARIANT
    - STACKED_TONE_MARK
  members: [a, b]
  render_conditions:
    - noto_sans_thai_regular__72__center
    - noto_sans_thai_regular__96__center
    - noto_serif_thai_regular__72__center
    - noto_serif_thai_regular__96__center
  reuse_locked_pairs_in_future_budget_experiment: true
  gate0_full_information_calls: 1600
  complete_four_budget_calls: 6400
  reduced_budget_calls_after_gate0_pass: 4800
  no_pair_replacement: true

prompt: "OCR:"
decoding: {do_sample: false, num_beams: 1, max_new_tokens: 32, use_cache: true, per_example_retry: false}
primary_parser:
  operation: PYTHON_STRIP_LEADING_TRAILING_WHITESPACE_ONLY
  unicode_normalization: NONE
  autocorrect: false
  punctuation_removal: false
  fuzzy_replacement: false

primary_outcome: EXACT_TARGET_TRANSCRIPTION_CORRECT
primary_analysis:
  model_family: MIXED_EFFECTS_LOGISTIC_REGRESSION
  formula: exact_correct ~ MODEL * BUDGET + FONT + FONT_SIZE + MEMBER + COMPONENT + (1 | pair_id)
  budget_coding: CATEGORICAL_WITH_B256_FULL_REFERENCE
  model_coding: BASE_REFERENCE
  font_coding: CATEGORICAL
  font_size_coding: CATEGORICAL
  member_coding: CATEGORICAL_A_REFERENCE
  component_role: NUISANCE_MAIN_EFFECT_ONLY
  confirmatory_test: TWO_SIDED_JOINT_3_DF_MODEL_BY_BUDGET_INTERACTION
  alpha: 0.05
  user_facing_effect: MARGINAL_G_COMPUTED_DIFFERENCE_IN_DIFFERENCES
  uncertainty: PAIR_ID_CLUSTER_BOOTSTRAP_PERCENTILE_95_CI
  bootstrap_resamples: 10000
  bootstrap_seed: 20260913
  budget_specific_multiplicity: HOLM_ACROSS_THREE_REDUCED_VS_FULL_CONTRASTS
  component_interactions: DESCRIPTIVE_DIAGNOSTIC_ONLY
  repeated_observations_not_independent: [MEMBER, FONT, FONT_SIZE, BUDGET, MODEL]
  no_directional_assumption: true
sensitivity_analysis:
  primary: PAIR_LEVEL_PAIRED_BOOTSTRAP_OF_MODEL_SPECIFIC_CHANGES_FROM_FULL
  secondary_metric: CODEPOINT_CER

gate0_measurement_validity:
  full_information_only: true
  exact_accuracy_lower_pair_clustered_ci_minimum_per_model: 0.20
  rationale: TWO_TIMES_10PP_SESOI_FROM_ZERO_FLOOR
  baseline_upper_bound_requirement: NONE
  output_contract_failure_maximum_per_model: 0.01
  visual_token_accounting: EXACT_EVERY_CALL
  unauthorized_or_out_of_workload_locked_pair_count: 0
  parser_runtime_corruption: NONE
  thai_output_rate: DIAGNOSTIC_NOT_GATE
  rendering_effects: PAIRED_CLUSTERED_CI_AND_MODEL_ADJUSTMENT_NOT_HARD_THRESHOLD
  component_headroom: DIAGNOSTIC_DOES_NOT_BLOCK_OVERALL_GATE

exclusion_rules:
  post_outcome_pair_or_observation_exclusion: FORBIDDEN
  output_contract_failure: RETAIN_AND_SCORE_INCORRECT
  empty_output: RETAIN_AND_SCORE_INCORRECT
  accuracy_based_replacement: FORBIDDEN
  missing_or_corrupt_input: FAIL_CLOSED_NO_IMPUTATION
  token_or_boundary_mismatch: FAIL_CLOSED
  model_or_processor_revision_mismatch: FAIL_CLOSED

authorization:
  locked_inference: false
  resolution_reduction_inference: false
  token_pruning: false
  token_merging: false
  fine_tuning: false
terminal_state: OVERALL_MODEL_BUDGET_DESIGN_FROZEN_PENDING_LOCKED_AUTHORIZATION
