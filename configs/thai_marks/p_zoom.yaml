prompt: TYPHOON_CARD   # Typhoon's own contract (configs/thai_marks/t1_t2.yaml prompts)

# Each tile is cropped from the source pixels, then read through the same
# resize_policy as a page (long side to 1800 px): text is ~1.85x larger in
# visual tokens than at page scale (tiling.zoom_factor, recorded per read).
tiling:
  rows: 2
  cols: 2
  overlap: 0.15

