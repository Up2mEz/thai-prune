# Whole-page reads (one read each, no crop, no masking): `repeat` is the T1 input unchanged;
# `pad` and `scale90` are P-ZOOM-2's near-copy perturbations; `pad12` and `scale75` are larger
# perturbations added so that the whole-page arm is not limited to near-copies.
# `masked_bands`: E4a's three masked reads (same size and token count as `repeat`).
# Equal-read-count arms (E4b section 3): W3 = repeat + pad + scale90; M3 = the three masked reads.
views:
  - {name: repeat, kind: whole}
  - {name: pad, kind: pad, margin: 0.04}
  - {name: scale90, kind: scale, factor: 0.9}
  - {name: pad12, kind: pad, margin: 0.12}
  - {name: scale75, kind: scale, factor: 0.75}
  - {name: masked_bands, kind: masked, rows: 3, cols: 1, overlap: 0.15}
