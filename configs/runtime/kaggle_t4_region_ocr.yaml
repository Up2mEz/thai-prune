schema_version: 1
backend: kaggle
accelerator: NvidiaTeslaT4

source:
  repository_url: https://github.com/Up2mEz/thai-prune.git
  remote_ref: refs/heads/codex/pinned-analysis-runner-amendment

python:
  version: "3.12"

uv:
  bootstrap_version: "0.11.25"
  sync_args: [--frozen, --extra, model]
  # Reused unchanged from the Paddle/Wayu locked panel, which completed 6,400
  # calls against these same checkpoints. It pins transformers 5.12.0, which is
  # what pyproject now pins exactly as well, so the remote environment and a
  # fresh local checkout resolve to the same version.
  transformers_override_lock: infra/kaggle/qwen35-requirements.lock

model_runtime:
  device: cuda
  dtype: float16
  attention_implementation: sdpa
  cache_dir: /tmp/huggingface

evidence_environment_contract:
  python: "3.12"
  transformers: "5.12.0"
  accelerator: NvidiaTeslaT4
  model_dtype: float16
  deterministic_decoding: true
  torch_deterministic_algorithms: false
  cudnn_deterministic: false
  cudnn_benchmark: false

paths:
  source_dir: /tmp/labbs2026-source
  output_root: /kaggle/working/artifacts
  dataset_root: /kaggle/input
