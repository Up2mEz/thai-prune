schema_version: 1
# PELY334 authorized M4 in session on 2026-10-11 ("ได้ลองทำเลย", in reply to the
# proposal in MODEL_SURVEY_M3_RESULTS.md §6.2), with M1-M3's process: run first,
# Up2mEz reviews afterwards. The Decision Log entry stays unmerged until Up2mEz
# approves.
status: APPROVED
registration: docs/stage0/MODEL_SURVEY_M4_REGISTRATION.md
authorization: docs/DECISION_LOG.md  # entry 2026-10-11b (PR; Up2mEz approval pending)
claim_level: PRELIMINARY_PILOT_NOT_GATE_EVIDENCE

model_role: wayu
models:
  wayu:
    model_id: wayu-ai/wayu-paxa-ocr-zero
    revision: af0204b4f334a6d5068b6bac2b3738932d6e289b  # M1-M3's
prompt_kind: OCR_NATIVE
prompts:
  OCR_NATIVE: "OCR:"

benchmark:
  repo: typhoon-ai/ThaiOCRBench
  revision: ca610d1ab330
  split: test
  tasks: ["Full-page OCR", "Text recognition"]
split:
  seed: 20260927
  calibration_fraction: 0.30
  run_on: calibration
runtime:
  dtype_preferred: float16
  dtype_fallback: float32
  attention: sdpa
  image_policy: typhoon_card

# The scoring pass: one teacher-forced forward per M3 output (no generation).
scoring_pass:
  outputs_archive: docs/stage0/data/M3_OUTPUTS_e970f61dc74c.json.gz
  outputs_run_id: kaggle-model-survey-m3-e970f61dc74c
  outputs_arm: E
  chunk: 512                       # positions per fp32 log-softmax block
shards: 2
budget_cap_t4_hours: 1

# Offline analysis (model_survey.m4), fixed before any score exists.
analysis:
  window_min_chars: 20             # non-space characters per window
  label_max_cer: 0.4               # a window located in the reference below this CER is `read`
  label_task: "Full-page OCR"      # labels only where the reference is the whole page
  primary_score: s_mean
  threshold_quantile: 0.10         # of s_mean over ordinary-text windows (no escape, ended before the limit)
  agreement_floor: 0.98            # argmax agreement on ordinary outputs, else the scoring path is investigated first

# As M3: arms E and E0 come from M3's archive; base and Typhoon from T1's.
reference_arm:
  name: G
  run_id: kaggle-model-survey-m1-3431d9f9dccf
  outputs: docs/stage0/data/M1_OUTPUTS_3431d9f9dccf.json.gz
  role: wayu
comparison:
  run_id: kaggle-thai-marks-t1-t2-a44199c29759
  outputs: docs/stage0/data/T1_OUTPUTS_a44199c29759.json.gz
  roles: [base, typhoon]
  prompt: BENCHMARK_QUESTION
scoring:
  null_seed: 20260928
  order_free: {max_cer: 0.4, residual: true}
  bootstrap: {resamples: 2000, seed: 20261011}
