schema_version: 1
# PELY334 authorized M3 in session on 2026-10-11 ("ลองดู" to the proposal in
# MODEL_SURVEY_M2_RESULTS.md §6.2, then "ทำต่อเลย ได้อนุมัติแล้ว"), with M1's and
# M2's process: run first, Up2mEz reviews afterwards. The Decision Log entry
# stays unmerged until Up2mEz approves.
status: APPROVED
registration: docs/stage0/MODEL_SURVEY_M3_REGISTRATION.md
authorization: docs/DECISION_LOG.md  # entry 2026-10-11 (PR; Up2mEz approval pending)
claim_level: PRELIMINARY_PILOT_NOT_GATE_EVIDENCE

model_role: wayu
models:
  wayu:
    model_id: wayu-ai/wayu-paxa-ocr-zero
    revision: af0204b4f334a6d5068b6bac2b3738932d6e289b  # M1's and M2's
prompt_kind: OCR_NATIVE            # Wayu's primary prompt in M1
prompts:
  OCR_NATIVE: "OCR:"

# Benchmark, split, image policy and decoding are M1's (= T1's); only the
# escape is added (model_survey.escape).
benchmark:
  repo: typhoon-ai/ThaiOCRBench
  revision: ca610d1ab330
  split: test
  tasks: ["Full-page OCR", "Text recognition"]
split:
  seed: 20260927
  calibration_fraction: 0.30
  run_on: calibration
runtime:
  dtype_preferred: float16
  dtype_fallback: float32
  attention: sdpa
  image_policy: typhoon_card
  max_new_tokens: 3072              # caps the kept output, as in M1
  generation:
    do_sample: false
    num_beams: 1
    repetition_penalty: 1.0
    no_repeat_ngram_size: 0
  use_cache: true

# The escape arm (E). Variant B's rule (k = 8 / 6) is the watch; its constants
# live in model_survey.escape and thai_marks.loop_cut, tested equal to T5b's.
escape:
  arm: E
  every: 16                         # tokens between checks of the output
  max_escapes: 8                    # then the next run is stopped as in B
  max_total_steps: 6144             # decoded tokens per item, discarded ones included (2 x max_new_tokens)

# Arms read offline: G (M1's greedy outputs) and G+B (G with T5b's stop), as in M2.
reference_arm:
  name: G
  run_id: kaggle-model-survey-m1-3431d9f9dccf
  outputs: docs/stage0/data/M1_OUTPUTS_3431d9f9dccf.json.gz
  role: wayu
stopped_arm: G+B

shards: 2                           # E's items split by position, one shard per T4
unit_deadline_hours: 1.5
budget_cap_t4_hours: 3

comparison:
  run_id: kaggle-thai-marks-t1-t2-a44199c29759
  outputs: docs/stage0/data/T1_OUTPUTS_a44199c29759.json.gz
  roles: [base, typhoon]
  prompt: BENCHMARK_QUESTION

scoring:
  null_seed: 20260928
  order_free: {max_cer: 0.4, residual: true}
  bootstrap: {resamples: 2000, seed: 20261011}
