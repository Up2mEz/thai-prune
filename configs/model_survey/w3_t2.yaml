schema_version: 1
# MODEL_SURVEY W3: T2 (prior vs image, fp32 in-context tone oracle) on Pathumma
# Vision 3.0.0-Re, then Qwen3-VL-4B-Instruct. Up2mEz's work split (collab
# 20261011T1315Z, W3): "copy, don't edit" configs/thai_marks/t1_t2.yaml. Every
# T2 field below is copied from it unchanged (tested); only the models differ.
# PELY334 authorized W3 in session on 2026-10-12 ("ทำทุกอันเลย", "do all of them"),
# under the standing delegation (DECISION_LOG 2026-10-11c).
status: APPROVED
registration: docs/stage0/MODEL_SURVEY_W3_REGISTRATION.md
claim_level: PRELIMINARY_PILOT_NOT_GATE_EVIDENCE
copied_from: configs/thai_marks/t1_t2.yaml

models:
  pathumma:   # = configs/model_survey/m5.yaml
    model_id: nectec/Pathumma-llm-vision-3.0.0-re
    revision: 08bb11dcabf509ac3fa3ac0014ecd44eadb9729b
    shards: 2
    unit_deadline_hours: 4.0
  qwen3vl4b:  # = configs/model_survey/m1.yaml; fp32 is 17.7 GB, so one process over both T4s
    model_id: Qwen/Qwen3-VL-4B-Instruct
    revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
    shards: 1
    device_map: two_gpus
    unit_deadline_hours: 8.0

# Two Kaggle runs: W3a (Pathumma, one shard per T4) and W3b (Qwen3-VL-4B, one
# process that sees both T4s).
runs:
  w3a: {roles: [pathumma], kernel_slug: labbs2026-model-survey-w3a}
  w3b: {roles: [qwen3vl4b], kernel_slug: labbs2026-model-survey-w3b}
budget_cap_t4_hours: 24   # T4-hours: W3a 2 x 4, W3b 2 x 8 (both GPUs held)

benchmark:
  repo: typhoon-ai/ThaiOCRBench
  revision: ca610d1ab330
  split: test
  tasks: ["Full-page OCR", "Text recognition"]

split:
  seed: 20260927
  calibration_fraction: 0.30
  strata: [Task, category]
  run_on: calibration

prompts:
  TYPHOON_CARD:
    file: configs/thai_marks/typhoon_card_prompt.txt
    sha256: 0e6c57af282f83f3dfdfa30e33bb8e74e0e1addd974f6ee111c1c22b3d47594d
  BENCHMARK_QUESTION: item.question

runtime:
  dtype_preferred: float16
  dtype_fallback: float32      # used only if the first item yields non-finite logits
  attention: sdpa
  image_policy: typhoon_card   # long side to 1800 px if either side > 300 px

t2:
  prompt: TYPHOON_CARD
  dtype: float32
  window_after_chars: 8
  consistency_tolerance_nats:
    float16: 0.1
    float32: 0.001

# Greedy outputs for the "greedy" column: each model's archived BENCHMARK_QUESTION
# outputs (T2's results use BQ greedy for the base for the same reason: neither
# model was run with TYPHOON_CARD).
greedy:
  pathumma: {run: kaggle-model-survey-m5-8252b99e735d, prompt: BENCHMARK_QUESTION}
  qwen3vl4b: {run: kaggle-model-survey-m1-3431d9f9dccf, prompt: BENCHMARK_QUESTION}

scoring:
  null_seed: 20260928
