# MODEL_SURVEY W4, condition 3 follow-up: the LIVE decode-time stop check.
# W4_STOP_CHECK_ed02ad0.json replayed the stop on recorded calibration text;
# this run generates again with `model_survey.stop.LoopStoppingCriteria`
# attached to generate(). CALIBRATION ITEMS ONLY (stop.live_items over each
# model's calibration outputs archive): every output the offline cut changes,
# plus a seeded sample of 8 it leaves unchanged per model and prompt. Locked
# items are never read. Approved by PELY334's human (2026-10-14); within W4's
# approved GPU total (26.5 of 43 used before this run).
