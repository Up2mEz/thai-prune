schema_version: 1
# MODEL_SURVEY_M6a: Qwen-SEA-LION-v4-4B-VL and InternVL3.5-2B under M1's protocol,
# unchanged. Up2mEz's work split (collab 20261011T1315Z, W2, M6). DeepSeek-OCR-2
# needs its own runtime path and is M6b. PELY334 authorized M6 in session on
# 2026-10-12 ("ทำทุกอันเลย", "do all of them"), under the standing delegation
# (DECISION_LOG 2026-10-11c): calibration only, own quota, Up2mEz reviews afterwards.
status: APPROVED
registration: docs/stage0/MODEL_SURVEY_M6_REGISTRATION.md
clearance: docs/stage0/MODEL_SURVEY_M6_CLEARANCE.md
claim_level: PRELIMINARY_PILOT_NOT_GATE_EVIDENCE
run_label: m6a
kernel_slug: labbs2026-model-survey-m6a

# Pinned by commit; never load `main`. Clearance doc for licences and snapshots.
models:
  sealion:
    # MIT, not gated. config, processor and chat template equal Qwen3-VL-4B-Instruct's
    # at M1's revision (ebb281ec); only the weights differ (clearance §2).
    model_id: aisingapore/Qwen-SEA-LION-v4-4B-VL
    revision: d0734aa1b8113fce90997a83c1e4afe2c37c6205
    prompts: [BENCHMARK_QUESTION]
    primary_prompt: BENCHMARK_QUESTION   # no OCR prompt on the card; as Qwen3-VL-4B in M1
    shards: 2
    unit_deadline_hours: 3.0
  internvl:
    # Apache-2.0, not gated. The work split names the GitHub-format repo
    # OpenGVLab/InternVL3_5-2B @ 7d7bd7bc (remote code); this is its official
    # HF-format sibling, loadable by M1's runtime without remote code (clearance §3).
    model_id: OpenGVLab/InternVL3_5-2B-HF
    revision: 3f301ffcf3dcbb47893afae6650ea3e78d96fb6d
    prompts: [BENCHMARK_QUESTION]
    primary_prompt: BENCHMARK_QUESTION   # no OCR prompt on the card
    shards: 2
    unit_deadline_hours: 2.0

prompts:
  BENCHMARK_QUESTION: item.question

# Benchmark, split, image policy and decoding are M1's (= T1's), copied here so
# that a later change there cannot change this registration.
benchmark:
  repo: typhoon-ai/ThaiOCRBench
  revision: ca610d1ab330
  split: test
  tasks: ["Full-page OCR", "Text recognition"]

split:
  seed: 20260927
  calibration_fraction: 0.30
  run_on: calibration

runtime:
  dtype_preferred: float16     # T4 has no bf16; both cards ship bf16 - checked on the smoke
  dtype_fallback: float32      # used only if the first item yields non-finite logits
  attention: sdpa
  image_policy: typhoon_card   # long side to 1800 px if either side > 300 px
  max_new_tokens: 3072
  generation:
    do_sample: false           # SEA-LION's generation_config.json samples; greedy is passed explicitly
    num_beams: 1
    repetition_penalty: 1.0
    no_repeat_ngram_size: 0
  use_cache: true

# One Kaggle session with two T4s; each queue runs one shard of each model.
gpu_queues:
  - [sealion/0, internvl/0]
  - [sealion/1, internvl/1]
budget_cap_t4_hours: 10

comparison:
  run_id: kaggle-thai-marks-t1-t2-a44199c29759
  outputs: docs/stage0/data/T1_OUTPUTS_a44199c29759.json.gz
  roles: [base, typhoon]
  prompt: BENCHMARK_QUESTION

scoring:
  null_seed: 20260928
  order_free: {max_cer: 0.4, residual: true}  # v2, registered primary; repeat-aware reported beside it
  bootstrap: {resamples: 2000, seed: 20261010}
