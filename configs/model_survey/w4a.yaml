schema_version: 1
# MODEL_SURVEY W4, phase A: the confirmatory run on the LOCKED split.
# Approved by both researchers: DECISION_LOG 2026-10-12f (Up2mEz), 2026-10-13a
# (PELY334). Runs on Up2mEz's Kaggle account. Model entries are copied
# unchanged from their calibration configs (T1, M1, M5); only shards and
# deadlines are set for the locked split (calibration seconds per shard x 2.3 x 1.5).
status: APPROVED
registration: docs/stage0/MODEL_SURVEY_W4_LOCKED_REGISTRATION_DRAFT.md
claim_level: PRELIMINARY_PILOT_NOT_GATE_EVIDENCE
run_label: w4a
kernel_slug: labbs2026-model-survey-w4a

models:
  typhoon:
    model_id: typhoon-ai/typhoon-ocr1.5-2b
    revision: 9c8a8fa14905041d793f1e4e922312147956dcc0   # T1's; Apache-2.0-only revision
    prompts: [BENCHMARK_QUESTION]
    primary_prompt: BENCHMARK_QUESTION
    shards: 2
    unit_deadline_hours: 1.6   # calibration 0.88 h / 2 shards
  base:
    model_id: Qwen/Qwen3-VL-2B-Instruct
    revision: 89644892e4d85e24eaac8bacfd4f463576704203   # T1's
    prompts: [BENCHMARK_QUESTION]
    primary_prompt: BENCHMARK_QUESTION
    shards: 2
    unit_deadline_hours: 3.6   # calibration 2.05 h / 2 shards
  wayu:
    model_id: wayu-ai/wayu-paxa-ocr-zero
    revision: af0204b4f334a6d5068b6bac2b3738932d6e289b   # M1's
    prompts: [OCR_NATIVE]
    primary_prompt: OCR_NATIVE
    shards: 2
    unit_deadline_hours: 1.8   # calibration 1.03 h / 2 shards (OCR_NATIVE)
  pathumma:
    model_id: nectec/Pathumma-llm-vision-3.0.0-re
    revision: 08bb11dcabf509ac3fa3ac0014ecd44eadb9729b   # M5's
    prompts: [CARD_PROMPT, BENCHMARK_QUESTION]
    primary_prompt: CARD_PROMPT
    shards: 2
    unit_deadline_hours: 3.6   # calibration 2.06 h / 2 shards (both prompts)

prompts:
  OCR_NATIVE: "OCR:"                 # Wayu (M1)
  CARD_PROMPT: "อ่านข้อความในภาพนี้"     # Pathumma's card (M5)
  BENCHMARK_QUESTION: item.question

# Benchmark, split, image policy and decoding are T1's = M1's, unchanged; only
# run_on differs: the locked split, the complement of T1's calibration split.
benchmark:
  repo: typhoon-ai/ThaiOCRBench
  revision: ca610d1ab330
  split: test
  tasks: ["Full-page OCR", "Text recognition"]

split:
  seed: 20260927
  calibration_fraction: 0.30
  run_on: locked               # a --smoke run still reads calibration items only

runtime:
  dtype_preferred: float16
  dtype_fallback: float32      # used only if the first item yields non-finite logits
  attention: sdpa
  image_policy: typhoon_card   # long side to 1800 px if either side > 300 px
  max_new_tokens: 3072
  generation:
    do_sample: false
    num_beams: 1
    repetition_penalty: 1.0
    no_repeat_ngram_size: 0
  use_cache: true

gpu_queues:
  - [typhoon/0, base/0, wayu/0, pathumma/0]
  - [typhoon/1, base/1, wayu/1, pathumma/1]
budget_cap_t4_hours: 18

# W4 §6: paired bootstrap over pages (items sharing an image_sha256 resampled together).
scoring:
  null_seed: 20260928
  order_free: {max_cer: 0.4, residual: true}  # v2 primary; repeat-aware beside it in every cell
  bootstrap: {resamples: 10000, seed: 20261012, cluster: image_sha256}
