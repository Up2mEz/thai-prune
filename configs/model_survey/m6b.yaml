schema_version: 1
# MODEL_SURVEY_M6b: DeepSeek-OCR-2 under M1's protocol, with its own runner
# (model_survey.remote_m6b) in its own environment (m6b_requirements.txt):
# the card's transformers 4.46.3 remote code, fed in-memory images, fp16, eager
# attention, M1's greedy decoding. Registration Addendum 1 of
# MODEL_SURVEY_M6_REGISTRATION.md. PELY334 authorized M6 in session on
# 2026-10-12 ("ทำทุกอันเลย"), under the standing delegation.
status: APPROVED
registration: docs/stage0/MODEL_SURVEY_M6_REGISTRATION.md
clearance: docs/stage0/MODEL_SURVEY_M6_CLEARANCE.md
claim_level: PRELIMINARY_PILOT_NOT_GATE_EVIDENCE
run_label: m6b
kernel_slug: labbs2026-model-survey-m6b
runner_module: labbs2026.model_survey.remote_m6b
extra_hashed:
  - src/labbs2026/model_survey/remote_m6b.py
  - configs/model_survey/m6b_requirements.txt

models:
  deepseek:
    # Apache-2.0, not gated. Remote code read at this revision before the run.
    model_id: deepseek-ai/DeepSeek-OCR-2
    revision: aaa02f3811945a91062062994c5c4a3f4c0af2b0
    prompts: [CARD_PROMPT, BENCHMARK_QUESTION]
    primary_prompt: CARD_PROMPT
    shards: 2
    unit_deadline_hours: 3.5   # includes building the environment (~5 min)

prompts:
  # The card's plain-text prompt ("without layouts"); the runner puts DeepSeek's
  # "<image>" placeholder and a newline before every prompt, as the card's prompts do.
  CARD_PROMPT: "Free OCR. "
  BENCHMARK_QUESTION: item.question

# Benchmark, split, image policy and decoding are M1's (= T1's), copied here so
# that a later change there cannot change this registration.
benchmark:
  repo: typhoon-ai/ThaiOCRBench
  revision: ca610d1ab330
  split: test
  tasks: ["Full-page OCR", "Text recognition"]

split:
  seed: 20260927
  calibration_fraction: 0.30
  run_on: calibration

runtime:
  dtype_preferred: float16     # T4 has no bf16; the card's infer() autocasts bf16 - checked on the smoke
  dtype_fallback: float32      # used only if the first item yields non-finite logits
  attention: eager             # DeepSeek's remote code offers eager or flash-attention 2; T4 has no FA2
  image_policy: typhoon_card   # long side to 1800 px if either side > 300 px
  max_new_tokens: 3072
  generation:
    do_sample: false           # M1's greedy; the card's infer() also bans repeated 20-grams, M1 does not
    num_beams: 1
    repetition_penalty: 1.0
    no_repeat_ngram_size: 0
  use_cache: true

# One Kaggle session with two T4s, one shard each.
gpu_queues:
  - [deepseek/0]
  - [deepseek/1]
budget_cap_t4_hours: 8

comparison:
  run_id: kaggle-thai-marks-t1-t2-a44199c29759
  outputs: docs/stage0/data/T1_OUTPUTS_a44199c29759.json.gz
  roles: [base, typhoon]
  prompt: BENCHMARK_QUESTION

scoring:
  null_seed: 20260928
  order_free: {max_cer: 0.4, residual: true}  # v2, registered primary; repeat-aware reported beside it
  bootstrap: {resamples: 2000, seed: 20261010}
